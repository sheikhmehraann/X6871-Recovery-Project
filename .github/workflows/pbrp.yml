name: PBRP Recovery Build - Infinix X6871

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'PBRP Manifest Branch'
        required: true
        default: 'android-14.0'
        type: choice
        options:
          - 'android-14.0'
          - 'android-12.1'
          - 'twrp-16.0'
      build_type:
        description: 'Build Type'
        required: true
        default: 'eng'
        type: choice
        options:
          - 'eng'
          - 'userdebug'
      tree_mode:
        description: 'Device Tree Mode'
        required: true
        default: 'standalone'
        type: choice
        options:
          - 'standalone'
          - 'unified'
      clean_build:
        description: 'Clean CCACHE and output'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - android-16
    paths:
      - 'trees/pbrp/**'
      - 'trees/common/**'
      - 'device/infinix/Infinix-X6871/**'
      - 'device/transsion/mt6895-common/**'
      - 'scripts/repack_vendor_boot_a16.py'
      - '.github/workflows/pbrp.yml'

jobs:
  build:
    name: Build PBRP Recovery (X6871)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /var/lib/docker \
            /usr/local/.ghcup \
            /usr/local/share/vcpkg \
            /usr/share/ruby \
            /usr/share/rust \
            /usr/local/graalvm
          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune -a --force 2>/dev/null || true
          df -h

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python-is-python3 libssl-dev rsync bc liblz4-tool libncurses5-dev \
            squashfs-tools libtinfo5 openjdk-17-jdk-headless ccache zstd patch
          pip3 install zstandard lz4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/pbrp/.ccache
          key: pbrp-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            pbrp-ccache-${{ runner.os }}-

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Set Git Identity & Repo Config
        run: |
          git config --global user.name "sheikhmehraann"
          git config --global user.email "mehraann.19@gmail.com"
          git config --global color.ui false

      - name: Sync PBRP Manifest
        run: |
          mkdir -p $HOME/pbrp
          cd $HOME/pbrp
          BRANCH="${{ github.event.inputs.manifest_branch || 'android-14.0' }}"
          if [ "$BRANCH" = "twrp-16.0" ]; then
            REPO_URL="https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git"
          else
            REPO_URL="https://github.com/PitchBlackRecoveryProject/manifest_pb.git"
          fi
          echo "Initializing repo from $REPO_URL ($BRANCH)..."
          repo init --no-repo-verify -u "$REPO_URL" -b "$BRANCH" --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch || repo sync -c -j2 --force-sync
          rm -rf .repo/project-objects .repo/projects

      - name: Setup Device Trees & Patches
        run: |
          cd $HOME/pbrp
          mkdir -p device/infinix device/transsion
          TREE_MODE="${{ github.event.inputs.tree_mode || 'standalone' }}"
          if [ "$TREE_MODE" = "standalone" ] && [ -d "$GITHUB_WORKSPACE/trees/pbrp" ]; then
            echo "Deploying standalone PBRP device tree..."
            cp -r "$GITHUB_WORKSPACE/trees/pbrp" device/infinix/Infinix-X6871
            ln -sf Infinix-X6871 device/infinix/X6871
            cp -r "$GITHUB_WORKSPACE/trees/common" device/transsion/mt6895-common
          else
            echo "Deploying unified device tree..."
            cp -r "$GITHUB_WORKSPACE/device/infinix/Infinix-X6871" device/infinix/Infinix-X6871
            ln -sf Infinix-X6871 device/infinix/X6871
            cp -r "$GITHUB_WORKSPACE/device/transsion/mt6895-common" device/transsion/mt6895-common
          fi

      - name: Build PBRP Recovery Image
        run: |
          cd $HOME/pbrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export PB_DEVICE_SPECIFICATION="Infinix GT 20 Pro (X6871)"
          export PB_TORCH_PATH="/sys/class/torch/torch/torch_level"
          export PB_BATTERY_PATH="/sys/class/power_supply/battery"
          export PB_VIBRATOR_PATH="/sys/class/leds/vibrator_single/activate"
          export PB_BUILD_TYPE="OFFICIAL"
          export PBRP_MAINTAINER="sheikhmehraann"
          export PBRP_BRANCH="16.0"
          export PBRP_STATUS="STABLE"
          export LC_ALL="C"
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/pbrp/.ccache
          export CCACHE_TEMPDIR=$HOME/pbrp/.ccache/tmp
          export CCACHE_EXEC=/usr/bin/ccache
          mkdir -p $HOME/pbrp/.ccache/tmp
          ccache -M 20G
          ccache -o compression=true
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            ccache -C
          fi
          ccache -z

          BUILD_TYPE="${{ github.event.inputs.build_type || 'eng' }}"
          source build/envsetup.sh
          lunch pb_X6871-$BUILD_TYPE || lunch omni_X6871-$BUILD_TYPE
          (mka pbrp vendorbootimage -j$(nproc) || mka vendorbootimage -j$(nproc)) 2>&1 | tee build.log
          ccache -s

      - name: Package & Repack Artifacts
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          TARGET_DIR="$HOME/pbrp/out/target/product/X6871"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/pbrp/out/target/product/Infinix-X6871"
          fi

          if [ -d "$TARGET_DIR" ]; then
            if [ -f "$TARGET_DIR/vendor_boot.img" ]; then
              echo "--- Repacking vendor_boot.img with stock Android 16 Fragment 0 and DTB ---"
              python3 $GITHUB_WORKSPACE/scripts/repack_vendor_boot_a16.py \
                $GITHUB_WORKSPACE/reference/stock_vendor_boot.img.gz \
                "$TARGET_DIR/vendor_boot.img" \
                $GITHUB_WORKSPACE/output/vendor_boot.img

              DATE_STR=$(date +%Y%m%d)
              cp -vf $GITHUB_WORKSPACE/output/vendor_boot.img "$GITHUB_WORKSPACE/output/PBRP-$DATE_STR-X6871.img"
              cd $GITHUB_WORKSPACE/output
              zip -r9 "PBRP-$DATE_STR-X6871.zip" vendor_boot.img
              sha256sum * > SHA256SUMS.txt 2>/dev/null || true
              md5sum * > MD5SUMS.txt 2>/dev/null || true
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PBRP-X6871-Recovery
          path: output/*

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: PBRP-Build-Failure-Logs
          path: |
            /home/runner/pbrp/build.log
            /home/runner/pbrp/out/error*.log
            /home/runner/pbrp/out/soong.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*
          name: "PBRP Recovery - Infinix GT 20 Pro (X6871) ${{ github.ref_name }}"
          body: |
            ## PitchBlack Recovery Project — Infinix GT 20 Pro (X6871)
            * Maintainer: `sheikhmehraann`
            * Target: `vendor_boot` (Boot Header v4, Dual ZSTD Fragments)
            * Platform: `mt6895 (Dimensity 8200 Ultimate)`
            * Display: 1080x2436 144Hz AMOLED
            * Storage: FBEv2 Decryption via KeyMint v3.0 / Gatekeeper
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
