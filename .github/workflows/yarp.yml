name: YARP Recovery Build - Infinix X6871

on:
  workflow_dispatch:

jobs:
  build:
    name: Build YARP Recovery (X6871)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /var/lib/docker \
            /usr/local/.ghcup \
            /usr/local/share/vcpkg \
            /usr/share/ruby \
            /usr/share/rust \
            /usr/local/graalvm
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 libssl-dev rsync bc liblz4-tool libncurses5-dev \
            squashfs-tools libtinfo5 openjdk-11-jdk-headless ccache zstd

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize TWRP/YARP Minimal Manifest
        run: |
          mkdir -p ~/yarp_workspace && cd ~/yarp_workspace
          git config --global user.name "sheikhmehraann"
          git config --global user.email "dev@recovery.local"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-16.0
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags

      - name: Setup Device Trees
        run: |
          cd ~/yarp_workspace
          mkdir -p device/infinix device/transsion
          cp -r "$GITHUB_WORKSPACE/device/infinix/Infinix-X6871" device/infinix/Infinix-X6871
          cp -r "$GITHUB_WORKSPACE/device/transsion/mt6895-common" device/transsion/mt6895-common

      - name: Build YARP Recovery
        run: |
          cd ~/yarp_workspace
          source build/envsetup.sh
          source device/infinix/Infinix-X6871/vendorsetup.sh
          lunch yarp_X6871-eng
          mka adbd vendorbootimage -j$(nproc)

      - name: Package & Repack Image
        run: |
          cd ~/yarp_workspace
          PRODUCT_DIR="out/target/product/Infinix-X6871"
          if [ ! -d "$PRODUCT_DIR" ]; then
            PRODUCT_DIR="out/target/product/X6871"
          fi
          
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$PRODUCT_DIR/vendor_boot.img" "$GITHUB_WORKSPACE/output/YARP_vendor_boot.img"

          python3 "$GITHUB_WORKSPACE/scripts/repack_vendor_boot_a16.py" \
            "$GITHUB_WORKSPACE/reference/stock_vendor_boot.img.gz" \
            "$PRODUCT_DIR/vendor_boot.img" \
            "$GITHUB_WORKSPACE/output/YARP_vendor_boot_repacked.img" || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YARP-Infinix-X6871
          path: output/*.img
