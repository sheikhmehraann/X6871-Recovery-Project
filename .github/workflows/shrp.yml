name: SHRP Recovery Build - Infinix X6871

on:
  workflow_dispatch:

jobs:
  build:
    name: Build SHRP Recovery (X6871)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /var/lib/docker \
            /usr/local/.ghcup \
            /usr/local/share/vcpkg \
            /usr/share/ruby \
            /usr/share/rust \
            /usr/local/graalvm
          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune -a --force 2>/dev/null || true
          sudo apt-get purge -y azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox powershell imagemagick ant unixodbc-dev 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 libssl-dev rsync bc liblz4-tool libncurses5-dev \
            squashfs-tools libtinfo5 openjdk-11-jdk-headless ccache

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Set Git Identity & Repo Config
        run: |
          git config --global user.name "sheikhmehraann"
          git config --global user.email "mehraann.19@gmail.com"
          git config --global color.ui false

      - name: Sync SHRP Minimal Tree
        run: |
          mkdir -p $HOME/shrp
          cd $HOME/shrp
          repo init --no-repo-verify -u https://github.com/SHRP/manifest.git -b shrp-12.1 --depth=1 || repo init --no-repo-verify -u https://github.com/SHRP-Reborn/manifest.git -b shrp-12.1 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch || repo sync -c -j2 --force-sync
          rm -rf .repo

      - name: Setup Device Trees & Patches
        run: |
          cd $HOME/shrp
          mkdir -p device/infinix device/transsion
          cp -r $GITHUB_WORKSPACE/device/infinix/Infinix-X6871 device/infinix/
          ln -sf Infinix-X6871 device/infinix/X6871
          cp -r $GITHUB_WORKSPACE/device/transsion/mt6895-common device/transsion/

          if [ ! -d "external/gflags" ]; then
            git clone --depth=1 https://android.googlesource.com/platform/external/gflags/ -b android-12.1.0_r4 external/gflags || true
          fi

          echo "WITH_DEXPREOPT := false" >> device/transsion/mt6895-common/BoardConfigCommon.mk
          if grep -q "func shouldBuildBootImages" build/soong/java/dexpreopt_bootjars.go 2>/dev/null; then
            sed -i '/func shouldBuildBootImages(/a \\tif global.DisablePreoptBootImages { return false }' build/soong/java/dexpreopt_bootjars.go
          fi

          if [ -f build/blueprint/gotestrunner/gotestrunner.go ]; then
            cp -f $GITHUB_WORKSPACE/scripts/gotestrunner.go build/blueprint/gotestrunner/gotestrunner.go
          fi

          if [ -f "$GITHUB_WORKSPACE/scripts/graphics_drm.cpp" ] && [ -f "bootable/recovery/minuitwrp/graphics_drm.cpp" ]; then
            cp -f $GITHUB_WORKSPACE/scripts/graphics_drm.cpp bootable/recovery/minuitwrp/graphics_drm.cpp
          fi

          if [ -d bootable/recovery ]; then
            patch_file="$GITHUB_WORKSPACE/device/infinix/Infinix-X6871/patches/0001-Change-haptics-activation-file-path.patch"
            if [ -f "$patch_file" ]; then
              git -C bootable/recovery apply "$patch_file" >/dev/null 2>&1 || true
            fi
          fi

      - name: Build SHRP Recovery Image
        run: |
          cd $HOME/shrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export SHRP_DEV="sheikhmehraann"
          export LC_ALL="C"
          export USE_CCACHE=1

          source build/envsetup.sh
          lunch shrp_X6871-eng || lunch omni_X6871-eng
          mka shrp vendorbootimage -j$(nproc) || mka vendorbootimage -j$(nproc)

      - name: Package Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          TARGET_DIR="$HOME/shrp/out/target/product/X6871"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/shrp/out/target/product/Infinix-X6871"
          fi

          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -name "SHRP*.zip" -exec cp -vf {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
            if [ -f "$TARGET_DIR/vendor_boot.img" ]; then
              cp -vf "$TARGET_DIR/vendor_boot.img" $GITHUB_WORKSPACE/output/vendor_boot.img
              cp -vf "$TARGET_DIR/vendor_boot.img" "$GITHUB_WORKSPACE/output/SHRP-$(date +%Y%m%d)-X6871.img"
              cd $GITHUB_WORKSPACE/output
              zip -r9 "SHRP-$(date +%Y%m%d)-X6871.zip" vendor_boot.img
            fi
            cd $GITHUB_WORKSPACE/output
            sha256sum * > SHA256SUMS.txt 2>/dev/null || true
            md5sum * > MD5SUMS.txt 2>/dev/null || true
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-X6871-Recovery
          path: output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: output/*
          tag_name: shrp-${{ github.run_number }}
          name: "SHRP Recovery - Infinix GT 20 Pro (X6871) #${{ github.run_number }}"
          body: |
            ## SkyHawk Recovery Project — Infinix GT 20 Pro (X6871)
            * Maintainer: `sheikhmehraann`
            * Updates: `t.me/Gt20ProINUpdates`
            * Community: `t.me/Gt20ProIN`
            * Platform: `mt6895 (Dimensity 8200 Ultimate)`
            * Device: `Infinix GT 20 Pro (X6871)`
            * Target: `vendor_boot` (Header v4, Virtual A/B)
            * Display: 1080x2436 144Hz AMOLED with single-pipe DRM
            * Storage: FBEv2 metadata decryption via KeyMint V1
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
