name: TWRP 16.0 Recovery Build - Infinix X6871

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-16.0'
        type: choice
        options:
          - 'twrp-16.0'
          - 'twrp-14.1'
          - 'twrp-12.1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'eng'
        type: choice
        options:
          - 'eng'
          - 'userdebug'
      tree_mode:
        description: 'Device Tree Mode'
        required: true
        default: 'standalone'
        type: choice
        options:
          - 'standalone'
          - 'unified'
      clean_build:
        description: 'Clean CCACHE and output'
        required: false
        default: false
        type: boolean
jobs:
  build:
    name: Build TWRP Recovery (X6871)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /var/lib/docker \
            /usr/local/.ghcup \
            /usr/local/share/vcpkg \
            /usr/share/ruby \
            /usr/share/rust \
            /usr/local/graalvm
          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune -a --force 2>/dev/null || true
          df -h

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python-is-python3 libssl-dev rsync bc liblz4-tool libncurses5-dev \
            squashfs-tools libtinfo5 openjdk-17-jdk-headless ccache zstd patch
          pip3 install zstandard lz4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/twrp/.ccache
          key: twrp-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            twrp-ccache-${{ runner.os }}-

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Set Git Identity & Repo Config
        run: |
          git config --global user.name "sheikhmehraann"
          git config --global user.email "mehraann.19@gmail.com"
          git config --global color.ui false

      - name: Sync TWRP Minimal Manifest
        run: |
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          BRANCH="${{ github.event.inputs.manifest_branch || 'twrp-16.0' }}"
          if [ "$BRANCH" = "twrp-16.0" ]; then
            REPO_URL="https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git"
          else
            REPO_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          fi
          echo "Initializing repo from $REPO_URL ($BRANCH)..."
          repo init --no-repo-verify -u "$REPO_URL" -b "$BRANCH" --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch || repo sync -c -j2 --force-sync
          rm -rf .repo/project-objects .repo/projects

      - name: Setup Device Trees & Patches
        run: |
          cd $HOME/twrp
          mkdir -p device/infinix device/transsion
          TREE_MODE="${{ github.event.inputs.tree_mode || 'standalone' }}"
          if [ "$TREE_MODE" = "standalone" ] && [ -d "$GITHUB_WORKSPACE/trees/twrp" ]; then
            echo "Deploying standalone TWRP device tree..."
            cp -r "$GITHUB_WORKSPACE/trees/twrp" device/infinix/X6871
                        cp -r "$GITHUB_WORKSPACE/trees/common" device/transsion/mt6895-common
          else
            echo "Deploying unified device tree..."
            cp -r "$GITHUB_WORKSPACE/device/infinix/Infinix-X6871" device/infinix/X6871
                        cp -r "$GITHUB_WORKSPACE/device/transsion/mt6895-common" device/transsion/mt6895-common
          fi

          if [ -f "$GITHUB_WORKSPACE/scripts/graphics_drm.cpp" ] && [ -f "bootable/recovery/minuitwrp/graphics_drm.cpp" ]; then
            cp -f "$GITHUB_WORKSPACE/scripts/graphics_drm.cpp" bootable/recovery/minuitwrp/graphics_drm.cpp
          fi

      - name: Build TWRP Recovery Image
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_DEVICE_VERSION="X6871_sheikhmehraann"
          export LC_ALL="C"
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/twrp/.ccache
          export CCACHE_TEMPDIR=$HOME/twrp/.ccache/tmp
          export CCACHE_EXEC=/usr/bin/ccache
          mkdir -p $HOME/twrp/.ccache/tmp
          ccache -M 20G
          ccache -o compression=true
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            ccache -C
          fi
          ccache -z

          BUILD_TYPE="${{ github.event.inputs.build_type || 'eng' }}"
          set -o pipefail
          source build/envsetup.sh
          lunch twrp_X6871-ap2a-$BUILD_TYPE || lunch twrp_X6871-$BUILD_TYPE || lunch omni_X6871-$BUILD_TYPE
          mka adbd vendorbootimage -j$(nproc) 2>&1 | tee build.log
          ccache -s

      - name: Package & Repack Header v4 Artifacts
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          TARGET_DIR="$HOME/twrp/out/target/product/X6871"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/twrp/out/target/product/Infinix-X6871"
          fi

          if [ -f "$TARGET_DIR/vendor_boot.img" ]; then
            echo "--- Repacking vendor_boot.img with stock Android 16 Fragment 0 and DTB ---"
            python3 $GITHUB_WORKSPACE/scripts/repack_vendor_boot_a16.py \
              $GITHUB_WORKSPACE/reference/stock_vendor_boot.img.gz \
              "$TARGET_DIR/vendor_boot.img" \
              $GITHUB_WORKSPACE/output/vendor_boot.img

            DATE_STR=$(date +%Y%m%d)
            cp -vf $GITHUB_WORKSPACE/output/vendor_boot.img "$GITHUB_WORKSPACE/output/TWRP-$DATE_STR-X6871.img"
            cd $GITHUB_WORKSPACE/output
            zip -r9 "TWRP-$DATE_STR-X6871.zip" vendor_boot.img
            sha256sum * > SHA256SUMS.txt 2>/dev/null || true
            md5sum * > MD5SUMS.txt 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TWRP-X6871-Recovery
          path: output/*

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TWRP-Build-Failure-Logs
          path: |
            /home/runner/twrp/build.log
            /home/runner/twrp/out/error*.log
            /home/runner/twrp/out/soong.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*
          name: "TWRP Recovery - Infinix GT 20 Pro (X6871) ${{ github.ref_name }}"
          body: |
            ## TWRP 16.0 Recovery Unofficial — Infinix GT 20 Pro (X6871)
            * Maintainer: `sheikhmehraann`
            * Target: `vendor_boot` (Boot Header v4, Dual ZSTD Fragments)
            * Android Version: Android 16 (Stock XOS 16 / Linux Kernel 6.12 GKI)
            * Display: 1080x2436 144Hz AMOLED atomic DRM
            * Storage: FBEv2 Decryption via Trustonic KeyMint v3.0 / Gatekeeper
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
