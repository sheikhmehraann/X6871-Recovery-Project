name: OrangeFox 16.0 Recovery Build - Infinix X6871

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_16.0'
        type: choice
        options:
          - 'fox_16.0'
          - '14.1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'eng'
        type: choice
        options:
          - 'eng'
          - 'userdebug'
      clean_build:
        description: 'Clean CCACHE and output'
        required: false
        default: false
        type: boolean
jobs:
  build:
    name: Build OrangeFox Recovery (X6871)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /var/lib/docker \
            /usr/local/.ghcup \
            /usr/local/share/vcpkg \
            /usr/share/ruby \
            /usr/share/rust \
            /usr/local/graalvm
          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune -a --force 2>/dev/null || true
          df -h

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python-is-python3 libssl-dev rsync bc liblz4-tool libncurses5-dev \
            squashfs-tools libtinfo5 openjdk-17-jdk-headless ccache zstd patch
          pip3 install zstandard lz4

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/fox_workspace/.ccache
          key: ccache-ofox-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-ofox-${{ runner.os }}-

      - name: Set Git Identity
        run: |
          git config --global user.name "sheikhmehraann"
          git config --global user.email "mehraann.19@gmail.com"
          git config --global color.ui false

      - name: Sync OrangeFox Manifest
        run: |
          mkdir -p $HOME/fox_workspace
          cd $HOME/fox_workspace
          BRANCH="${{ github.event.inputs.manifest_branch || 'fox_16.0' }}"
          echo "Syncing OrangeFox manifest (branch: $BRANCH)..."
          repo init --no-repo-verify -u https://gitlab.com/orangefox/manifest.git -b "$BRANCH" --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch || repo sync -c -j2 --force-sync
          rm -rf .repo/project-objects .repo/projects

      - name: Setup Device Trees & Patches
        run: |
          cd $HOME/fox_workspace
          mkdir -p device/infinix device/transsion
          echo "Deploying unified Android 16 device tree..."
          cp -r "$GITHUB_WORKSPACE/device/infinix/X6871" device/infinix/X6871
          cp -r "$GITHUB_WORKSPACE/device/transsion/mt6895-common" device/transsion/mt6895-common

          if [ -d "system/sepolicy" ]; then
            echo "Purging hal_hwcrypto from sepolicy and file_contexts..."
            rm -f system/sepolicy/vendor/hal_hwcrypto_default.te
            find system/sepolicy/ -type f -name "*file_contexts*" -exec sed -i '/hwcrypto/d' {} +
            if [ -f "system/sepolicy/reqd_mask/reqd_mask.te" ]; then
              printf "attribute hal_hwcrypto;\nattribute hal_hwcrypto_client;\nattribute hal_hwcrypto_server;\ntype hal_hwcrypto_service;\n" >> system/sepolicy/reqd_mask/reqd_mask.te
            fi
          fi

      - name: Build OrangeFox Recovery Image
        run: |
          cd $HOME/fox_workspace
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/fox_workspace/.ccache
          export CCACHE_EXEC=$(which ccache)
          export BUILD_BROKEN_SRC_DIR_IS_WRITABLE=true
          ccache -M 20G
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            ccache -C
          fi
          ccache -z

          set -o pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          export FOX_USE_ZSTD_BINARY=1
          export FOX_BUILD_DEVICE=X6871
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VANILLA_BUILD=1
          export FOX_ENABLE_APP_MANAGER=1
          export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/mapper/system"
          export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/mapper/vendor"

          BUILD_TYPE="${{ github.event.inputs.build_type || 'eng' }}"
          lunch fox_X6871-trunk_staging-$BUILD_TYPE || lunch fox_X6871-ap2a-$BUILD_TYPE || lunch fox_X6871-$BUILD_TYPE
          mka adbd vendorbootimage -j$(nproc) 2>&1 | tee build.log
          ccache -s

      - name: Prepare & Repack Artifacts
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          TARGET_DIR="$HOME/fox_workspace/out/target/product/X6871"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/fox_workspace/out/target/product/Infinix-X6871"
          fi

          if [ -d "$TARGET_DIR" ]; then
            if [ -f "$TARGET_DIR/vendor_boot.img" ]; then
              echo "--- Repacking vendor_boot.img with stock Android 16 Fragment 0 and DTB ---"
              python3 $GITHUB_WORKSPACE/scripts/repack_vendor_boot_a16.py \
                $GITHUB_WORKSPACE/reference/stock_vendor_boot.img.gz \
                "$TARGET_DIR/vendor_boot.img" \
                $GITHUB_WORKSPACE/output/vendor_boot.img
            fi

            cp -vf "$TARGET_DIR"/OrangeFox* $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            DATE_STR=$(date +%Y%m%d)
            cp -vf $GITHUB_WORKSPACE/output/vendor_boot.img "$GITHUB_WORKSPACE/output/OrangeFox-R12.1-$DATE_STR-X6871.img" 2>/dev/null || true
            cd $GITHUB_WORKSPACE/output
            zip -r9 "OrangeFox-R12.1-$DATE_STR-X6871.zip" vendor_boot.img
            sha256sum * > SHA256SUMS.txt 2>/dev/null || true
            md5sum * > MD5SUMS.txt 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrangeFox-X6871-Recovery
          path: output/*

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: OrangeFox-Build-Failure-Logs
          path: |
            /home/runner/fox_workspace/build.log
            /home/runner/fox_workspace/out/error*.log
            /home/runner/fox_workspace/out/soong.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*
          name: "OrangeFox Recovery - Infinix GT 20 Pro (X6871) ${{ github.ref_name }}"
          body: |
            ## OrangeFox 16.0 Recovery Unofficial — Infinix GT 20 Pro (X6871)
            * Maintainer: `sheikhmehraann`
            * Target: `vendor_boot` (Boot Header v4, Dual ZSTD Fragments)
            * Android Version: Android 16 (Stock XOS 16 / Linux Kernel 6.12 GKI)
            * Dynamic Partitions: 16 stock logical partitions
            * Storage: FBEv2 Decryption via Trustonic KeyMint v3.0 / Gatekeeper
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
