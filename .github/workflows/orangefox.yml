name: OrangeFox Recovery Build - Infinix X6871

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.gitignore'

jobs:
  build:
    name: Build OrangeFox Recovery (X6871)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/share/swift \
            /opt/hostedtoolcache \
            /var/lib/docker
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 libssl-dev rsync bc liblz4-tool libncurses5-dev \
            squashfs-tools libtinfo5 openjdk-11-jdk-headless ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/fox_14.1/.ccache
          key: ccache-fox_14.1-${{ github.sha }}
          restore-keys: |
            ccache-fox_14.1-

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

      - name: Set Git Identity
        run: |
          git config --global user.name "sheikhmehraann"
          git config --global user.email "mehraann.19@gmail.com"

      - name: Sync OrangeFox Minimal Tree
        run: |
          mkdir -p $HOME/fox_14.1
          cd $HOME/fox_14.1
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git $HOME/OrangeFox_sync
          cd $HOME/OrangeFox_sync
          ./orangefox_sync.sh --branch 14.1 --path $HOME/fox_14.1
          echo "Reclaiming git pack cache from minimal tree..."
          rm -rf $HOME/fox_14.1/.repo
          df -h

      - name: Setup Device Trees & Patches
        run: |
          cd $HOME/fox_14.1

          echo "Deploying Infinix-X6871 device tree from repository..."
          mkdir -p device/infinix device/transsion
          cp -r $GITHUB_WORKSPACE/device/infinix/Infinix-X6871 device/infinix/
          ln -sf Infinix-X6871 device/infinix/X6871
          cp -r $GITHUB_WORKSPACE/device/transsion/mt6895-common device/transsion/
          chmod +x device/transsion/mt6895-common/recovery/root/system/bin/fox_apply_splash.sh 2>/dev/null || true


          if [ ! -d "external/gflags" ]; then
            echo "Cloning external/gflags..."
            git clone --depth=1 https://android.googlesource.com/platform/external/gflags/ -b android-14.0.0_r1 external/gflags || git clone --depth=1 https://github.com/gflags/gflags.git external/gflags
          fi

          echo "Applying Dexpreopt fix for minimal tree..."
          echo "WITH_DEXPREOPT := false" >> device/transsion/mt6895-common/BoardConfigCommon.mk
          if grep -q "func shouldBuildBootImages" build/soong/java/dexpreopt_bootjars.go 2>/dev/null; then
            sed -i '/func shouldBuildBootImages(/a \\tif global.DisablePreoptBootImages { return false }' build/soong/java/dexpreopt_bootjars.go
          fi

          echo "Applying Go Unit Test Runner Bypass..."
          if [ -f build/blueprint/gotestrunner/gotestrunner.go ]; then
            cp -f $GITHUB_WORKSPACE/scripts/gotestrunner.go build/blueprint/gotestrunner/gotestrunner.go
          fi

          if [ -f build/blueprint/bootstrap/bootstrap.go ]; then
            sed -i 's/Command:     "\$testRunner/Command:     "touch \$out # \$testRunner/g' build/blueprint/bootstrap/bootstrap.go
          fi

          echo "Applying Clang-Tidy Stub..."
          find prebuilts/ -name "clang-tidy" -type f -exec bash -c 'echo -e "#!/bin/sh\nexit 0" > "$1" && chmod +x "$1"' _ {} \; || true

          echo "Fetching KernelSU v3.3.0 LKM assets for built-in Fox Addon..."
          mkdir -p /tmp/ksu_assets
          curl -sSL "https://github.com/tiann/KernelSU/releases/download/v3.3.0/ksuinit-aarch64" -o /tmp/ksu_assets/ksuinit
          curl -sSL "https://github.com/tiann/KernelSU/releases/download/v3.3.0/lkm-aarch64-android12-5.10_kernelsu.ko" -o /tmp/ksu_assets/kernelsu.ko
          chmod 0755 /tmp/ksu_assets/ksuinit /tmp/ksu_assets/kernelsu.ko

          echo "Executing OrangeFox Universal Hardware & Architecture Patch Engine..."
          python3 $GITHUB_WORKSPACE/scripts/patch_ofox.py $HOME/fox_14.1

      - name: Build OrangeFox Recovery Image
        run: |
          cd $HOME/fox_14.1
          unset FOX_VERSION
          export FOX_MAINTAINER_PATCH_VERSION=1
          export FOX_BUILD_TYPE="Stable"
          export FOX_BUILD_DEVICE="X6871"
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_ALLOW_DISABLE_NAVBAR=1
          export OF_CHECK_OVERWRITE_ATTEMPTS=1
          export OF_ENABLE_LPTOOLS=1
          export OF_ENABLE_ALL_PARTITION_TOOLS=1
          export OF_SUPPORT_ALL_BLOCK_SU_MOUNTS=1
          export OF_SUPPORT_ALL_PAYLOAD_EXTRACTOR=1
          export OF_ALLOW_DISABLE_FORCE_ENCRYPTION=1
          export OF_SETTINGS_CUSTOM_PATH="/sdcard/Fox"
          export OF_DYNAMIC_FULL_SIZE=9126805504
          export FOX_ENABLE_APP_MANAGER=1
          export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/mapper/system"
          export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/mapper/vendor"
          export FOX_RECOVERY_INSTALL_PARTITION="/dev/block/by-name/vendor_boot"
          export FOX_RECOVERY_BOOT_PARTITION="/dev/block/by-name/boot"
          export FOX_USE_BASH_SHELL=1
          export FOX_ASH_IS_BASH=1
          export FOX_USE_TAR_BINARY=1
          export FOX_USE_LZ4_BINARY=1
          export FOX_USE_SED_BINARY=1
          export FOX_USE_XZ_UTILS=1
          export FOX_USE_ZSTD_BINARY=1
          export FOX_USE_NANO_EDITOR=1
          export FOX_DELETE_AROMAFM=1
          export FOX_VARIANT="15.1.2"
          export OF_MAINTAINER="sheikhmehraann"
          export OF_ENABLE_FRP_ADDON=1
          export FOX_SUPPORT_KSU=1
          export OF_SCREEN_H=2436
          export OF_STATUS_H=90
          export OF_CLOCK_POS=0
          export OF_STATUS_INDENT_LEFT=48
          export OF_STATUS_INDENT_RIGHT=48
          export OF_FLASHLIGHT_ENABLE=1
          export OF_FL_PATH1="/sys/class/torch/torch/torch_level"
          export OF_FL_PATH2="/sys/devices/virtual/torch/torch/torch_level"

          export OF_USE_GREEN_LED=0

          export OF_USE_MAGISKBOOT=1
          export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1
          export OF_KEEP_MAGISKBOOT=1
          export OF_PATCH_AVB20=1
          export OF_ADVANCED_SECURITY=1
          export OF_REPORT_DECRYPT_STATUS=1
          export FOX_REPLACE_TOOLBOX_GETPROP=1
          export OF_USE_HEXDUMP=1
          export OF_SUPPORT_POST_FLASH_SCRIPT=1
          export OF_SKIP_MULTI_BOOT_CHECK=1
          export TARGET_DEVICE_ALT="X6871,Infinix-X6871,Infinix_X6871,X6871-OP"

          export OF_USE_TWRP_SAR_DETECT=1
          export OF_SUPPORT_OZIP_DECRYPTION=1
          export OF_DEFAULT_KEYMASTER_VERSION=2
          export OF_FBE_METADATA_MOUNT_IGNORE=0
          export OF_SKIP_DECRYPTED_ADOPTED_STORAGE=1
          export OF_SPLASH_MAX_SIZE=8192
          export OF_FAST_CHARGE_PATH="/sys/class/power_supply/charger/input_current_limit"
          export LC_ALL="C"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=$HOME/fox_14.1/.ccache
          export CCACHE_TEMPDIR=$HOME/fox_14.1/.ccache/tmp
          mkdir -p $HOME/fox_14.1/.ccache/tmp
          ccache -M 20G

          RELEASE_TAG="ap2a"
          if [ -d build/release/flag_values ]; then
            AVAIL_REL=$(ls -1 build/release/flag_values 2>/dev/null | head -n 1)
            if [ -n "$AVAIL_REL" ]; then
              RELEASE_TAG="$AVAIL_REL"
            fi
          fi
          export TARGET_RELEASE="$RELEASE_TAG"
          echo "Target release config: $TARGET_RELEASE"

          # Download and bundle Magisk v28.1 directly for native OrangeFox Root Addon
          curl -sSL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o /tmp/Magisk.zip || true
          if [ -f /tmp/Magisk.zip ]; then
            export FOX_USE_SPECIFIC_MAGISK_ZIP="/tmp/Magisk.zip"
            mkdir -p $HOME/fox_14.1/vendor/recovery/OrangeFox/FoxFiles/OF_Magisk
            cp -vf /tmp/Magisk.zip $HOME/fox_14.1/vendor/recovery/OrangeFox/FoxFiles/OF_Magisk/Magisk.zip || true
          fi

          set +e
          source build/envsetup.sh
          lunch twrp_X6871-${TARGET_RELEASE}-eng || lunch twrp_X6871-ap2a-eng || lunch twrp_X6871-eng
          LUNCH_STATUS=$?
          set -e
          if [ $LUNCH_STATUS -ne 0 ]; then
            echo "ERROR: lunch failed with exit code $LUNCH_STATUS"
            exit 1
          fi

          mka -j$(nproc) adbd vendorbootimage

      - name: Prepare Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          TARGET_DIR="$HOME/fox_14.1/out/target/product/Infinix-X6871"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/fox_14.1/out/target/product/X6871"
          fi

          if [ -d "$TARGET_DIR" ]; then
            cp -vf "$TARGET_DIR"/OrangeFox* $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            cp -vf "$TARGET_DIR"/vendor_boot.img $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          fi

          # Prune any 0-byte corrupted files immediately
          find $GITHUB_WORKSPACE/output -type f -size 0 -delete

          # If the OrangeFox zip is missing or was empty, package vendor_boot into flashable installer zip
          OFOX_ZIP=$(find $GITHUB_WORKSPACE/output -name "OrangeFox-*.zip" -type f 2>/dev/null | head -n 1)
          if [ -z "$OFOX_ZIP" ] && [ -f "$GITHUB_WORKSPACE/output/vendor_boot.img" ]; then
            ZIP_NAME="OrangeFox-R12.1_$(date +%Y%m%d)_15.1.2-Stable-X6871.zip"
            echo "Packaging fallback flashable recovery zip: $ZIP_NAME"
            cd $GITHUB_WORKSPACE/output
            zip -r9 "$ZIP_NAME" vendor_boot.img
          fi

          echo "Bundling Root Suite (Magisk, KernelSU, APatch)..."
          mkdir -p $GITHUB_WORKSPACE/output/Root_Suite
          cp -vf /tmp/Magisk.zip $GITHUB_WORKSPACE/output/Root_Suite/Magisk-v28.1.zip 2>/dev/null || curl -sSL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o $GITHUB_WORKSPACE/output/Root_Suite/Magisk-v28.1.zip
          curl -sSL "https://github.com/tiann/KernelSU/releases/download/v3.3.0/KernelSU_v3.3.0_32601-release.apk" -o $GITHUB_WORKSPACE/output/Root_Suite/KernelSU-v3.3.0.apk || true
          curl -sSL "https://github.com/bmax121/APatch/releases/download/11224/APatch_11224_9a63e0f_HEAD-release-signed.apk" -o $GITHUB_WORKSPACE/output/Root_Suite/APatch-11224.apk || true
          cd $GITHUB_WORKSPACE/output/Root_Suite && zip -r ../OrangeFox-RootSuite-X6871.zip * || true
          rm -rf $GITHUB_WORKSPACE/output/Root_Suite

          # Strict validation: delete any 0-byte files so release asset upload never fails
          find $GITHUB_WORKSPACE/output -type f -size 0 -delete

          cd $GITHUB_WORKSPACE/output
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          md5sum * > MD5SUMS.txt 2>/dev/null || true
          echo "Generated artifacts:"
          ls -lh $GITHUB_WORKSPACE/output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6871-Recovery
          path: output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: output/*
          tag_name: build-${{ github.run_number }}
          name: "OrangeFox Recovery - Infinix GT 20 Pro (X6871) #${{ github.run_number }}"
          body: |
            ## OrangeFox Recovery Unofficial — Infinix GT 20 Pro (X6871)
            * **Maintainer:** `sheikhmehraann`
            * **Updates:** [GT 20 Pro Updates](https://t.me/Gt20ProINUpdates)
            * **Discussion:** [GT 20 Pro Discussion](https://t.me/Gt20ProIN)
            * **Platform:** `mt6895 (Dimensity 8200 Ultimate)`
            * **Device:** `Infinix GT 20 Pro (Infinix-X6871)`
            * **Stock ROM:** XOS Android 15 (SDK 35), `AP3A.240905.015.A2 / 180003`
            * **Recovery Target:** `vendor_boot` (Header v4, Virtual A/B)

            ### Features & Native Support
            - **Native 144Hz AMOLED UI:** Smooth 144 FPS recovery rendering (`TW_FRAMERATE := 144`) with single-pipe DRM
            - **Built-in KernelSU v3.3.0 LKM Addon:** One-tap `Install KernelSU v3.3.0` & `Uninstall KernelSU` directly inside Fox Addons (`/FFiles/KernelSU`)
            - **Remove Lockscreen PIN/Password Addon:** Built-in `OF_DelPass.zip` in Fox Addons to clear lockscreen credentials without breaking FBEv2 keys
            - **Remove FRP Lock Addon:** Built-in `OF_DelFRP.zip` in Fox Addons to wipe Factory Reset Protection
            - **Slot-Aware VBMeta AVB 2.0 Addon:** One-tap `Patch VBMeta (Disable AVB 2.0)` across `vbmeta_a/b`, `vbmeta_system_a/b`, and `vbmeta_vendor_a/b`
            - **Native Vendor_Boot Splash Changer:** Direct unpack & repack of Header v4 vendor_boot recovery image
            - **Official A/B Boot Slot Support:** Seamless boot slot display and switching via native recovery reboot menu
            - **Full Dynamic Partitions Support:** All 82 partitions and Transsion vendor partitions mounted and backup-ready
            - **Exact Stock Identity & Community Links:** Maintainer (`sheikhmehraann`) and Telegram links (`@Gt20ProINUpdates` / `@Gt20ProIN`) in About screen and startup log
            - **Haptics, Flashlight & Thermals:** AW8697 Linear Vibrator, OCP81375 rear camera torch, and live CPU temperature display (`soc_max`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
